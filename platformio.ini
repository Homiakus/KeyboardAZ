; Hapticpad 22+4, RP2040.
; Для Arduino-Pico (Earle Philhower) нужен отдельный PlatformIO platform:
; https://arduino-pico.readthedocs.io/en/latest/platformio.html
; После смены platform: удали .pio\build и собери заново.

[env:pico]
; Платформа с поддержкой core-switching для Arduino-Pico
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = pico
framework = arduino

; Явно выбираем Arduino-Pico вместо ArduinoCore-mbed
board_build.core = earlephilhower

; Параметры платы RP2040
board_build.mcu = rp2040
board_build.f_cpu = 133000000L

; Протокол загрузки (по умолчанию picotool, поддерживается также cmsis-dap, jlink, raspberrypi-swd)
upload_protocol = picotool
monitor_speed = 115200

; Low-latency build profile. -O2 is selected over the size-oriented -Os;
; the firmware is small and timing consistency is more important than flash size.
build_unflags = -Os
build_flags =
    -O2
    -DNDEBUG
    -DHAPTICPAD_PRESS_DEBOUNCE_US=2500
    -DHAPTICPAD_RELEASE_DEBOUNCE_US=4500
    -DHAPTICPAD_SCAN_PERIOD_US=250

; Зависимости библиотек
; Примечание: TinyUSB не используется в текущей реализации (USB Serial вместо HID)
; lib_deps =
;     adafruit/Adafruit TinyUSB Library
