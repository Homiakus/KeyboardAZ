silent: false
unleash:
  integration: false
  dry-run: false
  tags: ""
  output: "mutation-report.json"
  diff: ""
  output-statuses: "lctv"
  workers: 2
  test-cpu: 2
  timeout-coefficient: 5
  threshold:
    efficacy: 0
    mutant-coverage: 0
  exclude-files:
    - "^[^/]+\\.go$"
    - "^handler/"
    - "^tools/hid-capture/"
    - "_windows\\.go$"
    - "_other\\.go$"
    - "_test\\.go$"
mutants:
  arithmetic-base:
    enabled: true
  conditionals-boundary:
    enabled: true
  conditionals-negation:
    enabled: true
  increment-decrement:
    enabled: true
  invert-assignments:
    enabled: true
  invert-bitwise:
    enabled: true
  invert-bwassign:
    enabled: true
  invert-negatives:
    enabled: true
  invert-logical:
    enabled: true
  invert-loopctrl:
    enabled: true
  remove-self-assignments:
    enabled: true
