name: hidv3-host-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hidv3-host-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Format Go sources
        shell: pwsh
        working-directory: go-app
        run: |
          Get-ChildItem -Recurse -Filter *.go | ForEach-Object { gofmt -w $_.FullName }
      - name: Test all packages
        shell: pwsh
        working-directory: go-app
        run: go test ./...
      - name: Race-test HID and lifecycle packages
        shell: pwsh
        working-directory: go-app
        run: go test -race ./hidv3 ./transport ./connection ./protocol ./telemetry
      - name: Vet all packages
        shell: pwsh
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        shell: pwsh
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app
          if (git diff --cached --quiet) {
            Write-Host 'No formatting changes required'
            exit 0
          }
          git commit -m "style: format Raw HID v3 host implementation"
          git push origin HEAD:main
