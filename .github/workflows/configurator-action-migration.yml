name: configurator-action-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configurator-action-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Move configurator action semantics to domain package
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          replacements = {
              'config.ParseActionShortcut': 'domainaction.ParseShortcut',
              'config.NormalizeAction': 'domainaction.Normalize',
              'config.ValidateAction': 'domainaction.Validate',
              'config.ActionSummary': 'domainaction.Summary',
              'config.ActionCommand': 'domainaction.Command',
              'config.ActionMacro': 'domainaction.Macro',
              'config.ActionCombo': 'domainaction.Combo',
              'config.ActionText': 'domainaction.Text',
              'config.ActionKey': 'domainaction.Key',
              'config.ActionType': 'domainaction.Type',
              'config.Action': 'domainaction.Action',
          }

          def migrate(path_name, remove_config_if_unused):
              path = Path(path_name)
              s = path.read_text(encoding='utf-8')
              marker = '\t"hapticpad-go-app/config"\n'
              if marker not in s:
                  raise SystemExit(f'{path_name}: config import marker not found')
              s = s.replace(marker, '\tdomainaction "hapticpad-go-app/action"\n' + marker, 1)
              for old in sorted(replacements, key=len, reverse=True):
                  s = s.replace(old, replacements[old])
              if remove_config_if_unused and 'config.' not in s:
                  s = s.replace(marker, '', 1)
              path.write_text(s, encoding='utf-8')

          migrate('go-app/configurator_model.go', True)
          migrate('go-app/configurator_editing.go', True)
          migrate('go-app/configurator.go', True)
          '@ | python -
          gofmt -w go-app/configurator_model.go go-app/configurator_editing.go go-app/configurator.go
      - name: Verify configurator uses domain actions
        shell: pwsh
        run: |
          foreach ($path in @('go-app/configurator_model.go','go-app/configurator_editing.go','go-app/configurator.go')) {
            if (Select-String -Path $path -SimpleMatch 'config.Action') { throw "$path still uses config.Action" }
          }
          if (-not (Select-String -Path go-app/configurator_model.go -SimpleMatch 'domainaction.Action')) { throw 'configurator model domain action missing' }
          if (-not (Select-String -Path go-app/configurator_editing.go -SimpleMatch '*domainaction.Action')) { throw 'configurator editing domain action pointer missing' }
      - name: Race-test editor application path
        working-directory: go-app
        run: go test -race ./action ./controls ./textinput ./layoutedit ./handler ./architecture
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit configurator migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/configurator_model.go go-app/configurator_editing.go go-app/configurator.go
          if (git diff --cached --quiet) { throw 'configurator action migration produced no changes' }
          git commit -m "refactor: use action domain in configurator"
          git push origin HEAD:main
