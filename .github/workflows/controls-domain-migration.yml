name: controls-domain-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/controls-domain-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Move physical control catalog to controls domain
        shell: pwsh
        run: |
          @'
          import re
          from pathlib import Path

          # config remains a compatibility/persistence adapter but no longer owns
          # the physical button catalog.
          path = Path('go-app/config/keymap.go')
          s = path.read_text(encoding='utf-8')
          marker = '\tdomainaction "hapticpad-go-app/action"\n'
          if marker not in s:
              raise SystemExit('config action import marker not found')
          s = s.replace(marker, marker + '\t"hapticpad-go-app/controls"\n', 1)
          s, n = re.subn(
              r'const MainButtonCount = 22\n\n// ButtonNames.*?\nvar buttonIndexByName = func\(\) map\[string\]int \{.*?\n\}\(\)\n',
              'const MainButtonCount = controls.MainButtonCount\n\n// ButtonNames remains source-compatible while controls owns the catalog.\nvar ButtonNames = controls.Names()\n',
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'config button catalog replacements={n}')
          old = '''\tnormalized := normalizeButtonReference(value)
          \tif buttonIndex, ok := buttonIndexByName[normalized]; ok {
          \t\treturn buttonIndex, nil
          \t}
          '''.replace('          ', '')
          new = '''\tif buttonIndex, ok := controls.Index(value); ok {
          \t\treturn buttonIndex, nil
          \t}
          '''.replace('          ', '')
          if old not in s:
              raise SystemExit('config button reference lookup block not found')
          s = s.replace(old, new, 1)
          s, n = re.subn(
              r'\nfunc normalizeButtonReference\(ref string\) string \{.*?\n\}\n',
              '\n', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'normalizeButtonReference removals={n}')
          path.write_text(s, encoding='utf-8')

          # textinput keeps no dependency on config after the catalog move.
          path = Path('go-app/textinput/config.go')
          s = path.read_text(encoding='utf-8')
          s = s.replace('\t"hapticpad-go-app/config"\n', '\t"hapticpad-go-app/controls"\n', 1)
          s = s.replace('config.ButtonNames[button]', 'controls.Name(button)')
          s, n = re.subn(
              r'func buttonIndex\(name string\) \(int, bool\) \{.*?\n\}',
              'func buttonIndex(name string) (int, bool) { return controls.Index(name) }',
              s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'textinput buttonIndex replacements={n}')
          if 'config.' in s or 'hapticpad-go-app/config' in s:
              raise SystemExit('textinput/config.go still references config after catalog migration')
          path.write_text(s, encoding='utf-8')

          path = Path('go-app/textinput/layout.go')
          s = path.read_text(encoding='utf-8')
          marker = '\tdomainaction "hapticpad-go-app/action"\n'
          if marker not in s:
              raise SystemExit('textinput/layout.go action import marker not found')
          s = s.replace(marker, marker + '\t"hapticpad-go-app/controls"\n', 1)
          s = s.replace('const MainButtonCount = 22', 'const MainButtonCount = controls.MainButtonCount')
          path.write_text(s, encoding='utf-8')

          # layoutedit preview used config only for physical names.
          path = Path('go-app/layoutedit/preview.go')
          s = path.read_text(encoding='utf-8')
          s = s.replace('\t"hapticpad-go-app/config"\n', '\t"hapticpad-go-app/controls"\n', 1)
          s = s.replace('config.ButtonNames[button]', 'controls.Name(button)')
          if 'config.' in s or 'hapticpad-go-app/config' in s:
              raise SystemExit('layoutedit/preview.go still references config after catalog migration')
          path.write_text(s, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/controls go-app/config/keymap.go go-app/textinput/config.go go-app/textinput/layout.go go-app/layoutedit/preview.go
      - name: Verify one physical-control source of truth
        shell: pwsh
        run: |
          if (-not (Select-String -Path go-app/config/keymap.go -SimpleMatch 'const MainButtonCount = controls.MainButtonCount')) { throw 'config count alias missing' }
          if (-not (Select-String -Path go-app/config/keymap.go -SimpleMatch 'var ButtonNames = controls.Names()')) { throw 'config name compatibility alias missing' }
          $textinputProduction = Get-ChildItem go-app/textinput -Filter *.go | Where-Object { $_.Name -notlike '*_test.go' }
          if ($textinputProduction | Select-String -SimpleMatch 'hapticpad-go-app/config') { throw 'textinput production code still imports config' }
          $layouteditProduction = Get-ChildItem go-app/layoutedit -Filter *.go | Where-Object { $_.Name -notlike '*_test.go' }
          if ($layouteditProduction | Select-String -SimpleMatch 'hapticpad-go-app/config') { throw 'layoutedit production code still imports config' }
          if (-not (Select-String -Path go-app/textinput/layout.go -SimpleMatch 'const MainButtonCount = controls.MainButtonCount')) { throw 'textinput count does not use controls domain' }
      - name: Race-test controls and consumers
        working-directory: go-app
        run: go test -race ./controls ./action ./config ./textinput ./layoutedit ./handler ./architecture
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit controls migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/controls go-app/config/keymap.go go-app/textinput/config.go go-app/textinput/layout.go go-app/layoutedit/preview.go
          if (git diff --cached --quiet) { throw 'controls migration produced no changes' }
          git commit -m "refactor: make controls domain canonical"
          git push origin HEAD:main
