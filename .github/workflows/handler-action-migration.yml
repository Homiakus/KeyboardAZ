name: handler-action-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/handler-action-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Move handler action semantics to domain package
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('go-app/handler/actions.go')
          s = path.read_text(encoding='utf-8')
          marker = '\t"hapticpad-go-app/config"\n'
          if marker not in s:
              raise SystemExit('handler config import marker not found')
          s = s.replace(marker, '\tdomainaction "hapticpad-go-app/action"\n\t"hapticpad-go-app/config"\n', 1)

          replacements = {
              'config.Action': 'domainaction.Action',
              'config.ActionCommand': 'domainaction.Command',
              'config.ActionMacro': 'domainaction.Macro',
              'config.ActionKey': 'domainaction.Key',
              'config.ActionText': 'domainaction.Text',
              'config.ActionCombo': 'domainaction.Combo',
          }
          # Replace longer constants first so config.Action does not consume their prefix.
          for old in sorted(replacements, key=len, reverse=True):
              s = s.replace(old, replacements[old])

          path.write_text(s, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/handler/actions.go
      - name: Verify handler dependency split
        shell: pwsh
        run: |
          if (-not (Select-String -Path go-app/handler/actions.go -SimpleMatch 'domainaction "hapticpad-go-app/action"')) { throw 'handler action import missing' }
          if (Select-String -Path go-app/handler/actions.go -SimpleMatch 'config.Action') { throw 'handler still uses config.Action' }
          if (-not (Select-String -Path go-app/handler/actions.go -SimpleMatch 'keymap *config.KeymapConfig')) { throw 'keymap compatibility dependency unexpectedly removed' }
      - name: Test handler and action domain with race detector
        working-directory: go-app
        run: go test -race ./action ./config ./handler ./textinput ./layoutedit
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit handler migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/handler/actions.go
          if (git diff --cached --quiet) { throw 'handler action migration produced no changes' }
          git commit -m "refactor: use action domain in handler"
          git push origin HEAD:main
