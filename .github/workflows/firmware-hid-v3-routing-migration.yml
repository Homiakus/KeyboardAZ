name: firmware-hid-v3-routing-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firmware-hid-v3-routing-migration.yml
      - .github/scripts/firmware_hid_v3_routing_switch.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply HID v3 realtime routing migration
        run: python3 .github/scripts/firmware_hid_v3_routing_switch.py
      - name: Verify realtime routing ownership
        shell: bash
        run: |
          grep -F '#include "hid_v3_transport.h"' src/MacroPad.ino
          grep -F 'uint32_t g_realtimeSequence = 0;' src/MacroPad.ino
          grep -F 'HapticpadHIDV3::begin()' src/MacroPad.ino
          grep -F 'HapticpadHIDV3::send(report)' src/MacroPad.ino
          grep -F 'HapticpadProtocolV3::EventType::Stroke' src/MacroPad.ino
          grep -F 'HapticpadProtocolV3::EventType::Tap' src/MacroPad.ino
          grep -F 'HapticpadProtocolV3::EventType::Language' src/MacroPad.ino
          grep -F 'hid_send_failed' src/MacroPad.ino
          grep -F 'firmware_hid_v3_state_machine_test.cpp' tests/run_native_firmware_tests.sh
      - name: Run native firmware contracts
        run: bash ./tests/run_native_firmware_tests.sh
      - name: Install pinned PlatformIO Core
        run: |
          python3 -m pip install --disable-pip-version-check 'platformio==6.1.19'
          pio --version | grep '6.1.19'
      - name: Build CDC production firmware
        run: pio run -e pico
      - name: Build Raw HID v3 candidate firmware
        run: pio run -e pico-hid-v3
      - name: Commit HID v3 realtime routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MacroPad.ino tests/run_native_firmware_tests.sh
          if git diff --cached --quiet; then
            echo 'HID v3 realtime migration produced no changes' >&2
            exit 1
          fi
          git commit -m "fix: route realtime firmware events over HID v3"
          git pull --rebase origin main
          git push origin HEAD:main
