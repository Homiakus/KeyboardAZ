name: configurator-migration

on:
  push:
    branches: [main]
    paths:
      - tools/migrate_configurator_editor.py
      - go-app/configurator_editing.go
      - go-app/configurator_capture.go
      - .github/workflows/configurator-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Apply transactional configurator migration
        run: python tools/migrate_configurator_editor.py
      - name: Remove migrated legacy imports
        shell: pwsh
        run: |
          $path = 'go-app/configurator.go'
          $lines = Get-Content $path
          $lines = $lines | Where-Object { $_ -notmatch '^\s*"time"\s*$' }
          Set-Content -Path $path -Value $lines -Encoding utf8
      - name: Format migrated sources
        shell: pwsh
        run: |
          gofmt -w go-app/main.go go-app/configurator.go go-app/configurator_editing.go go-app/configurator_capture.go go-app/layoutedit/preview.go
      - name: Verify application service ownership
        shell: pwsh
        run: |
          if (-not (Select-String -Path go-app/main.go -SimpleMatch 'layoutEditor      *layoutedit.Session')) { throw 'layoutEditor was not wired into App' }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch 'coreState         *appcore.State')) { throw 'coreState was not wired into App' }
          if (Select-String -Path go-app/configurator.go -Pattern 'textinput\.SetBinding\(') { throw 'Gio still mutates bindings directly' }
          if (Select-String -Path go-app/configurator.go -Pattern 'textinput\.SetThumbTap\(') { throw 'Gio still mutates thumb taps directly' }
      - name: Test Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows application
        working-directory: go-app
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit migrated configurator
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/configurator.go go-app/layoutedit/preview.go
          if (git diff --cached --quiet) { throw 'migration produced no changes' }
          git commit -m "refactor: move configurator mutations behind application services"
          git push origin HEAD:main
