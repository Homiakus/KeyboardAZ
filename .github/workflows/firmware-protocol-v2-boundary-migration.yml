name: firmware-protocol-v2-boundary-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firmware-protocol-v2-boundary-migration.yml
      - .github/scripts/firmware_protocol_v2_boundary_switch.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply protocol v2 boundary migration
        run: python3 .github/scripts/firmware_protocol_v2_boundary_switch.py
      - name: Verify protocol boundary ownership
        shell: bash
        run: |
          grep -F '#include "protocol_v2.h"' src/MacroPad.ino
          grep -F 'HapticpadProtocolV2::encodeError(' src/MacroPad.ino
          grep -F 'HapticpadProtocolV2::encodeReady(' src/MacroPad.ino
          grep -F 'HapticpadProtocolV2::encodeArmed(' src/MacroPad.ino
          grep -F 'HapticpadProtocolV2::encodeStroke(' src/MacroPad.ino
          grep -F 'HapticpadProtocolV2::encodeTap(' src/MacroPad.ino
          grep -F 'HapticpadProtocolV2::encodeLanguage(' src/MacroPad.ino
          grep -F 'HapticpadProtocolV2::encodeStatus(' src/MacroPad.ino
          grep -F 'void writeProtocolBuffer(const char* buffer, size_t length)' src/MacroPad.ino
          ! grep -F 'snprintf(' src/MacroPad.ino
          ! grep -F 'writeProtocolLine(' src/MacroPad.ino
      - name: Run native firmware contracts
        run: bash ./tests/run_native_firmware_tests.sh
      - name: Install pinned PlatformIO Core
        run: |
          python3 -m pip install --disable-pip-version-check 'platformio==6.1.19'
          pio --version | grep '6.1.19'
      - name: Build CDC production firmware
        run: pio run -e pico
      - name: Build Raw HID v3 candidate firmware
        run: pio run -e pico-hid-v3
      - name: Commit protocol v2 boundary integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MacroPad.ino
          if git diff --cached --quiet; then
            echo 'protocol v2 boundary migration produced no changes' >&2
            exit 1
          fi
          git commit -m "refactor: isolate firmware protocol v2 formatter"
          git pull --rebase origin main
          git push origin HEAD:main
