name: telemetry-composition-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telemetry-composition-migration.yml
      - .github/scripts/telemetry_composition_switch.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Apply telemetry composition migration
        shell: pwsh
        run: |
          python .github/scripts/telemetry_composition_switch.py
          gofmt -w go-app/main.go go-app/serial/reader.go go-app/architecture/shell_boundaries_test.go
      - name: Verify production recorder ownership
        shell: pwsh
        run: |
          if (-not (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'health := telemetry.NewHealth()')) { throw 'main does not own Health' }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'connection.NewManagerWithRecorder(health)')) { throw 'manager is not injected' }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'serial.NewReaderWithRecorder(portName, baudRate, health)')) { throw 'CDC recorder is not injected' }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'realtimeOpenFromEnvironmentWithRecorder(health)')) { throw 'HID recorder is not injected' }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'handler.NewHandlerWithRecorder(keymap, health)')) { throw 'handler recorder is not injected' }
          if (-not (Select-String -Path go-app/serial/reader.go -SimpleMatch -CaseSensitive 'health := telemetry.RecorderOrProcess(r.health)')) { throw 'Reader compatibility fallback missing' }
          if (-not (Select-String -Path go-app/architecture/shell_boundaries_test.go -SimpleMatch -CaseSensitive 'TestCompositionRootInjectsApplicationTelemetryRecorder')) { throw 'telemetry architecture invariant missing' }
      - name: Race-test telemetry and input pipeline
        working-directory: go-app
        run: go test -race ./telemetry ./serial ./connection ./handler ./hidv3 ./architecture .
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit telemetry composition wiring
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/serial/reader.go go-app/architecture/shell_boundaries_test.go
          if (git diff --cached --quiet) { throw 'telemetry migration produced no changes' }
          git commit -m "refactor: inject application telemetry recorder"
          git push origin HEAD:main
