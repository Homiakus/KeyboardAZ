name: textinput-compiler-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/textinput-compiler-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Extract immutable resolver compiler
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('go-app/textinput/config.go')
          source = path.read_text(encoding='utf-8')

          resolver_start = source.index('type compiledLayout struct {')
          resolver_end = source.index('func ModeID(', resolver_start)
          resolver_block = source[resolver_start:resolver_end].rstrip() + '\n\n'
          source = source[:resolver_start] + source[resolver_end:]

          compiler_start = source.index('func compileLayout(')
          compiler_block = source[compiler_start:].rstrip() + '\n'
          source = source[:compiler_start].rstrip() + '\n'

          atomic_import = '\t"sync/atomic"\n'
          if atomic_import not in source:
              raise SystemExit('sync/atomic import missing before compiler split')
          source = source.replace(atomic_import, '', 1)
          path.write_text(source, encoding='utf-8')

          header = 'package textinput\n\nimport (\n\t"fmt"\n\t"strings"\n\t"sync/atomic"\n\n\tdomainaction "hapticpad-go-app/action"\n\t"hapticpad-go-app/controls"\n)\n\n// Resolver compiles mutable profile configuration into an immutable, lock-free\n// lookup snapshot. Replace builds a complete candidate before atomic publication.\n'
          Path('go-app/textinput/compiler.go').write_text(header + resolver_block + compiler_block, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/textinput/config.go go-app/textinput/compiler.go
      - name: Verify compiler boundary
        shell: pwsh
        run: |
          if (Select-String -Path go-app/textinput/config.go -SimpleMatch 'atomic.Pointer') { throw 'config.go still owns runtime compiler state' }
          if (Select-String -Path go-app/textinput/config.go -SimpleMatch 'func compileLayout(') { throw 'config.go still owns compiler' }
          if (-not (Select-String -Path go-app/textinput/compiler.go -SimpleMatch 'atomic.Pointer[compiledLayout]')) { throw 'immutable resolver snapshot missing' }
          if (-not (Select-String -Path go-app/textinput/compiler.go -SimpleMatch 'func compileLayout(')) { throw 'compiler implementation missing' }
      - name: Race-test resolver and editor boundaries
        working-directory: go-app
        run: go test -race ./action ./controls ./textinput ./layoutedit ./handler ./architecture
      - name: Run resolver benchmarks
        working-directory: go-app
        run: go test -bench=. -benchmem ./textinput
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit compiler split
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/textinput/config.go go-app/textinput/compiler.go
          if (git diff --cached --quiet) { throw 'textinput compiler split produced no changes' }
          git commit -m "refactor: isolate textinput resolver compiler"
          git push origin HEAD:main
