name: workspace-startup-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/workspace-startup-migration.yml
      - .github/scripts/workspace_startup_switch.py
      - go-app/startup_workspace.go

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Switch composition root to canonical workspace
        shell: pwsh
        run: |
          python .github/scripts/workspace_startup_switch.py
          gofmt -w go-app/main.go go-app/main_helpers_test.go go-app/startup_workspace.go
      - name: Verify workspace boundary
        shell: pwsh
        run: |
          if (-not (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'paths, startupError := prepareWorkspace()')) { throw 'startup does not use canonical workspace preparation' }
          if (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'workspace.FromRoot(getConfigDir())') { throw 'legacy workspace remains composition root' }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch -CaseSensitive 'return canonicalConfigDir()')) { throw 'tray/config directory is not canonical' }
          if (-not (Select-String -Path go-app/main_helpers_test.go -SimpleMatch -CaseSensitive 'workspace.Default()')) { throw 'config path test still asserts a legacy folder name' }
      - name: Race-test workspace and application boundaries
        working-directory: go-app
        run: go test -race ./workspace ./workspacemigrate ./architecture .
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit canonical workspace startup
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/main_helpers_test.go
          if (git diff --cached --quiet) { throw 'workspace startup switch produced no changes' }
          git commit -m "feat: migrate startup to canonical workspace"
          git push origin HEAD:main
