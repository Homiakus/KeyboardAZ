name: textinput-repository-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/textinput-repository-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Extract layout persistence adapter
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('go-app/textinput/config.go')
          source = path.read_text(encoding='utf-8')
          start = source.index('func LoadLayout(')
          end = source.index('func ValidateLayout(', start)
          persistence = source[start:end].rstrip() + '\n'

          source = source[:start] + source[end:]
          for imp in ['\t"encoding/json"\n', '\t"os"\n', '\t"path/filepath"\n']:
              if imp not in source:
                  raise SystemExit(f'expected import not found: {imp!r}')
              source = source.replace(imp, '', 1)
          path.write_text(source, encoding='utf-8')

          header = 'package textinput\n\nimport (\n\t"encoding/json"\n\t"fmt"\n\t"os"\n\t"path/filepath"\n\t"strings"\n)\n\n// File persistence is deliberately isolated from the layout model/compiler so\n// storage policy can evolve without pulling filesystem concerns into the hot\n// resolver and editing domain.\n'
          Path('go-app/textinput/repository.go').write_text(header + persistence, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/textinput/config.go go-app/textinput/repository.go
      - name: Verify persistence boundary
        shell: pwsh
        run: |
          if (Select-String -Path go-app/textinput/config.go -SimpleMatch 'os.ReadFile') { throw 'config.go still owns filesystem persistence' }
          if (Select-String -Path go-app/textinput/config.go -SimpleMatch 'json.NewDecoder') { throw 'config.go still owns JSON repository logic' }
          if (-not (Select-String -Path go-app/textinput/repository.go -SimpleMatch 'func LoadLayout(')) { throw 'LoadLayout missing from repository adapter' }
          if (-not (Select-String -Path go-app/textinput/repository.go -SimpleMatch 'func SaveLayout(')) { throw 'SaveLayout missing from repository adapter' }
      - name: Race-test layout boundaries
        working-directory: go-app
        run: go test -race ./action ./controls ./textinput ./layoutedit ./handler ./architecture
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit persistence split
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/textinput/config.go go-app/textinput/repository.go
          if (git diff --cached --quiet) { throw 'textinput persistence split produced no changes' }
          git commit -m "refactor: isolate textinput file repository"
          git push origin HEAD:main
