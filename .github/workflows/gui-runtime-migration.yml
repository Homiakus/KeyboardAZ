name: gui-runtime-migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gui-runtime-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Apply deterministic migration
        run: python tools/migrate_gui_runtime.py
      - name: Format migrated shell
        run: gofmt -w go-app/main.go go-app/main_test.go
      - name: Verify no legacy reconnect ownership remains
        run: |
          $legacy = Select-String -Path go-app/main.go -Pattern 'reader \*serial.Reader|reconnectInProgress|lastReconnectTime|func \(a \*App\) attemptReconnect|func \(a \*App\) handleSerialError'
          if ($legacy) { $legacy | Write-Output; throw 'legacy GUI reconnect ownership remains' }
      - name: Test Windows desktop
        working-directory: go-app
        run: go test .
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows application
        working-directory: go-app
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit migrated lifecycle
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/main_test.go
          if (git diff --cached --quiet) { throw 'migration produced no changes' }
          git commit -m "refactor: move GUI connection lifecycle to runtime"
          git push origin HEAD:main
