name: gio-upgrade-migration

# One-shot dependency migration. Remove immediately after the validated commit lands.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gio-upgrade-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Upgrade Gio and normalize module graph
        working-directory: go-app
        shell: pwsh
        run: |
          go get gioui.org@v0.10.2
          go mod tidy
          go list -m gioui.org
      - name: Apply Gio window API migration
        working-directory: go-app
        shell: pwsh
        run: |
          $path = 'main.go'
          $source = Get-Content $path -Raw
          $oldConstructor = 'w := app.NewWindow('
          $newConstructor = "w := new(app.Window)`r`n`t`tw.Option("
          if (-not $source.Contains($oldConstructor)) { throw 'legacy app.NewWindow call not found' }
          $source = $source.Replace($oldConstructor, $newConstructor)
          if (-not $source.Contains('e := w.NextEvent()')) { throw 'legacy NextEvent call not found' }
          $source = $source.Replace('e := w.NextEvent()', 'e := w.Event()')
          Set-Content -Path $path -Value $source -Encoding utf8
          gofmt -w $path
      - name: Verify Gio migration shape
        working-directory: go-app
        shell: pwsh
        run: |
          if (Select-String -Path main.go -SimpleMatch 'app.NewWindow') { throw 'legacy app.NewWindow remains' }
          if (Select-String -Path main.go -SimpleMatch '.NextEvent()') { throw 'legacy NextEvent remains' }
          if (-not (Select-String -Path main.go -SimpleMatch 'w := new(app.Window)')) { throw 'zero-value Gio window is missing' }
          if (-not (Select-String -Path main.go -SimpleMatch 'e := w.Event()')) { throw 'Gio Event loop migration is missing' }
      - name: Test Windows application
        working-directory: go-app
        shell: pwsh
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        shell: pwsh
        run: go vet ./...
      - name: Build Windows application
        working-directory: go-app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit validated Gio migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/go.mod go-app/go.sum
          if (git diff --cached --quiet) { throw 'Gio migration produced no changes' }
          git commit -m "build: upgrade Gio to 0.10.2"
          git pull --rebase origin main
          git push origin HEAD:main
