name: gio-upgrade-migration

# One-shot dependency migration. Remove immediately after the validated commit lands.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gio-upgrade-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Upgrade Gio and normalize module graph
        working-directory: go-app
        shell: pwsh
        run: |
          go get gioui.org@v0.10.2
          go mod tidy
          go list -m gioui.org
      - name: Test Windows application
        working-directory: go-app
        shell: pwsh
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        shell: pwsh
        run: go vet ./...
      - name: Build Windows application
        working-directory: go-app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit validated Gio migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/go.mod go-app/go.sum
          if (git diff --cached --quiet) { throw 'Gio migration produced no dependency changes' }
          git commit -m "build: upgrade Gio to 0.10.2"
          git pull --rebase origin main
          git push origin HEAD:main
