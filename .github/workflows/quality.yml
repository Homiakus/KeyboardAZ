name: quality

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  go-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Verify selected Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
      - name: Check formatting of all Go sources
        shell: bash
        run: |
          mapfile -d '' files < <(find . -type f -name '*.go' -print0)
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "Files requiring gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go test -race ./action ./controls ./config ./serial ./textinput ./protocol ./appcore ./telemetry ./device ./connection ./transport ./hidv3 ./latencyreport ./layoutedit ./workspace ./workspacemigrate ./architecture ./tools/latency ./tools/latency-compare
      - run: go vet ./action ./controls ./config ./serial ./textinput ./protocol ./appcore ./telemetry ./device ./connection ./transport ./hidv3 ./latencyreport ./layoutedit ./workspace ./workspacemigrate ./architecture ./tools/latency ./tools/latency-compare
      - run: go test -bench=. -benchmem ./textinput ./transport

  go-1-27-compat:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        working-directory: go-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.0
          cache-dependency-path: go-app/go.sum
      - name: Verify Go 1.27 is actually used
        shell: bash
        run: |
          go version | grep 'go1.27.0'
          test "$(go env GOTOOLCHAIN)" = "local"
      - run: go test -race ./action ./controls ./config ./serial ./textinput ./protocol ./appcore ./telemetry ./device ./connection ./transport ./hidv3 ./latencyreport ./layoutedit ./workspace ./workspacemigrate ./architecture ./tools/latency ./tools/latency-compare
      - run: go vet ./action ./controls ./config ./serial ./textinput ./protocol ./appcore ./telemetry ./device ./connection ./transport ./hidv3 ./latencyreport ./layoutedit ./workspace ./workspacemigrate ./architecture ./tools/latency ./tools/latency-compare

  windows-desktop:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: go-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Verify selected Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
      - run: go test ./action ./controls ./config ./serial ./textinput ./handler ./protocol ./appcore ./telemetry ./device ./connection ./transport ./hidv3 ./latencyreport ./layoutedit ./workspace ./workspacemigrate ./architecture ./tools/latency ./tools/latency-compare
      - run: go test -race ./action ./controls ./protocol ./appcore ./telemetry ./handler ./device ./connection ./transport ./hidv3 ./latencyreport ./layoutedit ./workspace ./workspacemigrate ./architecture
      - run: go test .
      - run: go vet ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - run: New-Item -ItemType Directory -Force ../dist | Out-Null
      - run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .

  firmware-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash ./tests/run_native_firmware_tests.sh

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify reproducible firmware inputs
        shell: bash
        run: |
          grep -Fx 'platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0' platformio.ini
          grep -F '[env:pico-hid-v3]' platformio.ini
      - name: Install pinned PlatformIO Core
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check 'platformio==6.1.19'
          pio --version | grep '6.1.19'
      - name: Build production CDC firmware
        shell: bash
        run: pio run -e pico
      - name: Verify production firmware output and size budget
        shell: bash
        run: |
          test -s .pio/build/pico/firmware.uf2
          bytes="$(stat --printf='%s' .pio/build/pico/firmware.uf2)"
          test "$bytes" -le 150000
          echo "production firmware.uf2 bytes=$bytes"
          sha256sum .pio/build/pico/firmware.uf2
      - name: Build Raw HID v3 candidate firmware
        shell: bash
        run: pio run -e pico-hid-v3
      - name: Verify Raw HID v3 candidate output and size budget
        shell: bash
        run: |
          test -s .pio/build/pico-hid-v3/firmware.uf2
          bytes="$(stat --printf='%s' .pio/build/pico-hid-v3/firmware.uf2)"
          test "$bytes" -le 180000
          echo "hid-v3 firmware.uf2 bytes=$bytes"
          sha256sum .pio/build/pico-hid-v3/firmware.uf2
