name: hidv3-compose-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hidv3-compose-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Wire opt-in realtime opener
        shell: pwsh
        run: |
          $path = 'go-app/main.go'
          $source = Get-Content $path -Raw
          $old = @'
          		Open: func(portName string) (connection.Session, error) {
          			return serial.NewReader(portName, baudRate)
          		},
          '@
          $new = @'
          		Open: func(portName string) (connection.Session, error) {
          			return serial.NewReader(portName, baudRate)
          		},
          		RealtimeOpen: realtimeOpenFromEnvironment(),
          '@
          $old = $old.Replace('          ', '')
          $new = $new.Replace('          ', '')
          if (-not $source.Contains($old.TrimStart("`r", "`n"))) { throw 'controller composition block not found' }
          $source = $source.Replace($old.TrimStart("`r", "`n"), $new.TrimStart("`r", "`n"))
          Set-Content -Path $path -Value $source -Encoding utf8
          gofmt -w $path
      - name: Verify default remains CDC
        shell: pwsh
        run: |
          if (-not (Select-String -Path go-app/main.go -SimpleMatch 'RealtimeOpen: realtimeOpenFromEnvironment()')) { throw 'realtime opener not wired' }
          if (-not (Select-String -Path go-app/realtime_transport.go -SimpleMatch 'case "", "cdc", "cdc-v2":')) { throw 'CDC default changed unexpectedly' }
      - name: Test Windows application
        working-directory: go-app
        run: go test ./...
      - name: Race-test realtime lifecycle
        working-directory: go-app
        run: go test -race ./hidv3 ./transport ./connection ./protocol ./telemetry
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit composition change
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/realtime_transport.go go-app/realtime_transport_test.go
          if (git diff --cached --quiet) { throw 'composition migration produced no changes' }
          git commit -m "feat: enable opt-in Raw HID v3 realtime path"
          git push origin HEAD:main
