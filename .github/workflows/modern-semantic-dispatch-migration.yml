name: modern-semantic-dispatch-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/modern-semantic-dispatch-migration.yml
      - .github/scripts/modern_semantic_dispatch_migration.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply modern semantic dispatch migration
        run: python3 .github/scripts/modern_semantic_dispatch_migration.py
      - name: Verify dispatch boundary
        shell: bash
        run: |
          grep -F 'if msg.Protocol >= 2 {' go-app/main.go
          grep -F 'a.handleSemanticProtocolMessage(msg)' go-app/main.go
          grep -F 'Ignoring unsupported modern semantic event' go-app/main.go
          if grep -F 'if msg.Protocol == 2 {' go-app/main.go; then
            echo 'legacy protocol-specific semantic dispatch remains' >&2
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Format and test application semantics
        working-directory: go-app
        shell: bash
        run: |
          gofmt -w main.go semantic_dispatch.go semantic_dispatch_test.go
          go test ./appcore ./textinput .
          go vet ./appcore ./textinput .
      - name: Commit modern semantic dispatch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/semantic_dispatch.go go-app/semantic_dispatch_test.go
          if git diff --cached --quiet; then
            echo 'semantic dispatch migration produced no changes' >&2
            exit 1
          fi
          git commit -m "fix: dispatch Raw HID v3 application semantics"
          git pull --rebase origin main
          git push origin HEAD:main
