name: appcore-dedup-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/appcore-dedup-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Remove duplicate App semantic fields and writes
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import textwrap

          path = Path('go-app/main.go')
          source = path.read_text(encoding='utf-8')

          # Remove duplicate fields. currentLayer remains for protocol-v1 only.
          for line in [
              '\tactiveButtonsMask uint32               // Битовая маска нажатых кнопок\n',
              '\tcurrentLanguage  string\n',
              '\tcurrentMode      string\n',
              '\tcurrentModifiers uint8\n',
              '\tactiveThumbMask  uint8\n',
              '\tprotocolVersion  int\n',
              '\tfirmwareVersion  string\n',
              '\tactiveButtons    []int\n',
          ]:
              if line not in source:
                  raise SystemExit(f'duplicate semantic field missing: {line!r}')
              source = source.replace(line, '', 1)

          # Snapshot always reads semantic state from appcore. Production always
          # constructs coreState; zero-value fallback remains safe for narrow tests.
          start = source.index('func (a *App) SnapshotState() AppSnapshot {')
          end = source.index('// Названия кнопок', start)
          replacement = textwrap.dedent('''
          func (a *App) SnapshotState() AppSnapshot {
              var reconnecting bool
              var reconnectAttempts int
              var runtimeConnected bool
              if a.connectionRuntime != nil {
                  runtimeSnapshot := a.connectionRuntime.Snapshot()
                  state := runtimeSnapshot.Connection.State
                  reconnecting = runtimeSnapshot.Connection.Recovering || state == connection.Reconnecting || state == connection.Degraded || state == connection.Opening || state == connection.Handshaking
                  reconnectAttempts = runtimeSnapshot.Connection.Attempts
                  runtimeConnected = runtimeSnapshot.HasSession && state == connection.Ready
              }

              semantic := appcore.Snapshot{Language: textinput.LanguageEnglish}
              if a.coreState != nil {
                  semantic = a.coreState.Snapshot()
              }

              a.mu.RLock()
              defer a.mu.RUnlock()

              historyCopy := make([]HistoryEntry, len(a.history))
              copy(historyCopy, a.history)
              portItemsCopy := make([]string, len(a.portItems))
              copy(portItemsCopy, a.portItems)

              connected := a.connected
              if a.connectionRuntime != nil {
                  connected = runtimeConnected
              }
              currentMode := "letters"
              if semantic.ProtocolVersion >= 2 {
                  currentMode = textinput.ModeName(semantic.Modifiers)
              }

              return AppSnapshot{
                  Connected: connected, Reconnecting: reconnecting, ReconnectAttempts: reconnectAttempts,
                  CurrentLayer: a.currentLayer, CurrentLanguage: semantic.Language, CurrentMode: currentMode,
                  CurrentModifiers: semantic.Modifiers, ActiveThumbMask: semantic.ActiveThumbMask,
                  ProtocolVersion: semantic.ProtocolVersion, FirmwareVersion: semantic.FirmwareVersion,
                  ActiveButtons: append([]int(nil), semantic.ActiveButtons...), ActiveButtonsMask: semantic.ActiveButtonsMask,
                  History: historyCopy, ErrorMsg: a.errorMsg, SerialPort: a.serialPort, PortItems: portItemsCopy,
              }
          }

          ''')
          source = source[:start] + replacement + source[end:]

          # Initialization no longer owns semantic defaults.
          source = source.replace('\t\tcurrentLanguage:      "en",\n\t\tcurrentMode:          "letters",\n', '')

          # Disconnect resets semantic state through appcore.SetConnection only.
          source = source.replace('\ta.activeButtons = nil\n\ta.activeButtonsMask = 0\n\ta.activeThumbMask = 0\n', '')

          # Remove protocol-v2 shell mirroring while preserving execution/history.
          old_ready = '''\t\ta.mu.Lock()
\t\tif msg.Protocol == 2 {
\t\t\ta.protocolVersion = 2
\t\t\ta.firmwareVersion = msg.Firmware
\t\t\ta.currentLanguage = msg.Language
\t\t\ta.currentMode = "letters"
\t\t}
\t\ta.connected = true
\t\ta.errorMsg = ""
\t\ta.mu.Unlock()
'''
          new_ready = '''\t\ta.mu.Lock()
\t\ta.connected = true
\t\ta.errorMsg = ""
\t\ta.mu.Unlock()
'''
          if old_ready not in source:
              raise SystemExit('ready semantic mirror block missing')
          source = source.replace(old_ready, new_ready, 1)

          source = source.replace('''\tif msg.Protocol == 2 {
\t\ta.mu.Lock()
\t\ta.protocolVersion = 2
\t\ta.mu.Unlock()

\t\tswitch msg.Type {
''', '''\tif msg.Protocol == 2 {
\t\tswitch msg.Type {
''', 1)

          source = source.replace('''\t\tcase "language":
\t\t\ta.mu.Lock()
\t\t\ta.currentLanguage = msg.Language
\t\t\ta.currentMode = "letters"
\t\t\ta.mu.Unlock()
\t\t\ta.appendHistory''', '''\t\tcase "language":
\t\t\ta.appendHistory''', 1)
          source = source.replace('''\t\tcase "status":
\t\t\ta.mu.Lock()
\t\t\ta.currentLanguage = msg.Language
\t\t\ta.activeThumbMask = msg.ThumbMask
\t\t\ta.mu.Unlock()
\t\t\ta.appendHistory''', '''\t\tcase "status":
\t\t\ta.appendHistory''', 1)
          source = source.replace('''\t\t\ta.mu.Lock()
\t\t\ta.activeButtons = nil
\t\t\ta.activeButtonsMask = 0
\t\t\ta.mu.Unlock()
\t\t\ta.appendHistory(HistoryEntry{Type: "tap"''', '''\t\t\ta.appendHistory(HistoryEntry{Type: "tap"''', 1)
          source = source.replace('''
\t\t\tmodeName := textinput.ModeName(msg.Modifiers)
\t\t\ta.mu.Lock()
\t\t\ta.currentLanguage = msg.Language
\t\t\ta.currentMode = modeName
\t\t\ta.currentModifiers = msg.Modifiers
\t\t\ta.activeButtons = msg.Buttons
\t\t\ta.activeButtonsMask = msg.Mask
\t\t\ta.mu.Unlock()

\t\t\tdetails :=''', '''
\t\t\tmodeName := textinput.ModeName(msg.Modifiers)
\t\t\tdetails :=''', 1)

          # Protocol-v1 still stores only its layer in App; buttons come from appcore.
          source = source.replace('''\ta.mu.Lock()
\ta.currentLayer = msg.Layer
\ta.activeButtons = msg.Buttons
\ta.activeButtonsMask = msg.Mask
\ta.mu.Unlock()
''', '''\ta.mu.Lock()
\ta.currentLayer = msg.Layer
\ta.mu.Unlock()
''', 1)

          path.write_text(source, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/main.go
      - name: Migrate shell concurrency test to appcore state
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('go-app/main_state_test.go')
          source = path.read_text(encoding='utf-8')
          source = source.replace('\t"hapticpad-go-app/config"\n', '\t"hapticpad-go-app/appcore"\n\t"hapticpad-go-app/config"\n\t"hapticpad-go-app/protocol"\n', 1)
          source = source.replace('\t\tcurrentLanguage:      "en",\n\t\tcurrentMode:          "letters",\n', '\t\tcoreState:            appcore.NewState(),\n', 1)
          old = '''\t\t\tfor j := 0; j < 50; j++ {
\t\t\t\tapp.mu.Lock()
\t\t\t\tapp.connected = (j%2 == 0)
\t\t\t\tapp.currentLanguage = "en"
\t\t\t\tapp.activeButtonsMask = uint32(1 << (id % 22))
\t\t\t\tapp.errorMsg = fmt.Sprintf("error %d", j)
\t\t\t\tapp.mu.Unlock()
\t\t\t\ttime.Sleep(1 * time.Millisecond)
\t\t\t}
'''
          new = '''\t\t\tfor j := 0; j < 50; j++ {
\t\t\t\tapp.mu.Lock()
\t\t\t\tapp.connected = (j%2 == 0)
\t\t\t\tapp.errorMsg = fmt.Sprintf("error %d", j)
\t\t\t\tapp.mu.Unlock()
\t\t\t\tbutton := id % 22
\t\t\t\tapp.coreState.ApplyEvent(protocol.Event{Protocol: 2, Type: "stroke", Language: "en", Button: button, Buttons: []int{button}, Mask: uint32(1 << button)})
\t\t\t\ttime.Sleep(1 * time.Millisecond)
\t\t\t}
'''
          if old not in source:
              raise SystemExit('main state concurrency mutation block missing')
          source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/main_state_test.go
      - name: Verify duplicate semantic state is gone
        shell: pwsh
        run: |
          foreach ($field in @('currentLanguage','currentModifiers','activeThumbMask','protocolVersion','firmwareVersion','activeButtonsMask')) {
            if (Select-String -Path go-app/main.go -Pattern "^\s+$field\s") { throw "App still owns semantic field $field" }
          }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch 'CurrentLanguage: semantic.Language')) { throw 'snapshot is not appcore-backed' }
      - name: Test shell and core under race detector
        working-directory: go-app
        run: go test -race ./appcore ./protocol ./textinput ./architecture .
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit semantic-state deduplication
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/main_state_test.go
          if (git diff --cached --quiet) { throw 'semantic state deduplication produced no changes' }
          git commit -m "refactor: make appcore the semantic state authority"
          git push origin HEAD:main
