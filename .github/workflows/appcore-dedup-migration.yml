name: appcore-dedup-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/appcore-dedup-migration.yml
      - .github/scripts/appcore_dedup.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Remove duplicate shell semantic state
        shell: pwsh
        run: |
          python .github/scripts/appcore_dedup.py
          gofmt -w go-app/main.go go-app/main_state_test.go
      - name: Verify duplicate semantic state is gone
        shell: pwsh
        run: |
          foreach ($field in @('currentLanguage','currentModifiers','activeThumbMask','protocolVersion','firmwareVersion','activeButtonsMask')) {
            if (Select-String -Path go-app/main.go -Pattern "^\s+$field\s") { throw "App still owns semantic field $field" }
          }
          if (-not (Select-String -Path go-app/main.go -SimpleMatch 'CurrentLanguage: semantic.Language')) { throw 'snapshot is not appcore-backed' }
      - name: Test shell and core under race detector
        working-directory: go-app
        run: go test -race ./appcore ./protocol ./textinput ./architecture .
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit semantic-state deduplication
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/main.go go-app/main_state_test.go
          if (git diff --cached --quiet) { throw 'semantic state deduplication produced no changes' }
          git commit -m "refactor: make appcore the semantic state authority"
          git push origin HEAD:main
