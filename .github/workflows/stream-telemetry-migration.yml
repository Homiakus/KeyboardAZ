name: stream-telemetry-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stream-telemetry-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Isolate HID telemetry stream
        shell: pwsh
        run: |
          $path = 'go-app/hidv3/source_windows.go'
          $source = Get-Content $path -Raw
          $old = 'telemetry.Process().ObserveTransportMessage(event.Protocol, event.Sequence, event.Type, event.Firmware)'
          $new = 'telemetry.Process().ObserveTransportMessageOn("hid-v3", event.Protocol, event.Sequence, event.Type, event.Firmware)'
          if (-not $source.Contains($old)) { throw 'legacy HID telemetry call not found' }
          $source = $source.Replace($old, $new)
          Set-Content -Path $path -Value $source -Encoding utf8
          Get-ChildItem go-app -Recurse -Filter *.go | ForEach-Object { gofmt -w $_.FullName }
      - name: Verify stream labels
        shell: pwsh
        run: |
          if (-not (Select-String -Path go-app/serial/reader.go -SimpleMatch 'ObserveTransportMessageOn(stream,')) { throw 'CDC stream-aware telemetry missing' }
          if (-not (Select-String -Path go-app/hidv3/source_windows.go -SimpleMatch 'ObserveTransportMessageOn("hid-v3"')) { throw 'HID stream-aware telemetry missing' }
      - name: Test Windows application
        working-directory: go-app
        run: go test ./...
      - name: Race-test telemetry and transports
        working-directory: go-app
        run: go test -race ./telemetry ./serial ./hidv3 ./transport ./connection
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit stream-aware telemetry
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/telemetry go-app/serial/reader.go go-app/hidv3/source_windows.go
          if (git diff --cached --quiet) { throw 'stream telemetry migration produced no changes' }
          git commit -m "fix: isolate CDC and HID sequence telemetry"
          git push origin HEAD:main
