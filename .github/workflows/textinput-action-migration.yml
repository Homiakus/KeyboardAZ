name: textinput-action-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/textinput-action-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Move textinput action model to domain package
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          config_path = Path('go-app/textinput/config.go')
          s = config_path.read_text(encoding='utf-8')
          marker = '\t"hapticpad-go-app/config"\n'
          if marker not in s:
              raise SystemExit('textinput config import marker not found')
          s = s.replace(marker, '\tdomainaction "hapticpad-go-app/action"\n\t"hapticpad-go-app/config"\n', 1)

          replacements = {
              'config.NormalizeAction': 'domainaction.Normalize',
              'config.ValidateAction': 'domainaction.Validate',
              'config.CloneAction': 'domainaction.Clone',
              'config.ActionCommand': 'domainaction.Command',
              'config.ActionMacro': 'domainaction.Macro',
              'config.ActionCombo': 'domainaction.Combo',
              'config.ActionText': 'domainaction.Text',
              'config.ActionKey': 'domainaction.Key',
              'config.Action': 'domainaction.Action',
          }
          for old in sorted(replacements, key=len, reverse=True):
              s = s.replace(old, replacements[old])
          config_path.write_text(s, encoding='utf-8')

          layout_path = Path('go-app/textinput/layout.go')
          s = layout_path.read_text(encoding='utf-8')
          marker = '\t"hapticpad-go-app/config"\n'
          if marker not in s:
              raise SystemExit('textinput layout config import marker not found')
          s = s.replace(marker, '\tdomainaction "hapticpad-go-app/action"\n', 1)
          s = s.replace('config.Action', 'domainaction.Action')
          layout_path.write_text(s, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/textinput/config.go go-app/textinput/layout.go
      - name: Verify textinput action dependency inversion
        shell: pwsh
        run: |
          $production = Get-ChildItem go-app/textinput -Filter *.go | Where-Object { $_.Name -notlike '*_test.go' }
          if ($production | Select-String -SimpleMatch 'config.Action') { throw 'textinput production code still uses config.Action' }
          if (-not (Select-String -Path go-app/textinput/config.go -SimpleMatch 'domainaction.Action')) { throw 'textinput domain action type missing' }
          if (-not (Select-String -Path go-app/textinput/config.go -SimpleMatch 'config.ButtonNames')) { throw 'button catalog compatibility unexpectedly removed' }
          if (Select-String -Path go-app/textinput/layout.go -SimpleMatch 'hapticpad-go-app/config') { throw 'layout resolver still depends on config package' }
      - name: Race-test action consumers
        working-directory: go-app
        run: go test -race ./action ./config ./textinput ./layoutedit ./handler
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit textinput migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/textinput/config.go go-app/textinput/layout.go
          if (git diff --cached --quiet) { throw 'textinput action migration produced no changes' }
          git commit -m "refactor: use action domain in textinput"
          git push origin HEAD:main
