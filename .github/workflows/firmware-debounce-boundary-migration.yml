name: firmware-debounce-boundary-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firmware-debounce-boundary-migration.yml
      - .github/scripts/firmware_debounce_boundary_switch.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply debounce boundary migration
        run: python3 .github/scripts/firmware_debounce_boundary_switch.py
      - name: Verify boundary ownership
        shell: bash
        run: |
          grep -F '#include "input_debounce.h"' src/MacroPad.ino
          grep -F 'HapticpadInput::makeDebouncedInput' src/MacroPad.ino
          grep -F 'HapticpadInput::observeRaw' src/MacroPad.ino
          grep -F 'HapticpadInput::advanceDebounce' src/MacroPad.ino
          grep -F 'HapticpadInput::pressedEdge' src/MacroPad.ino
          grep -F 'HapticpadInput::releasedEdge' src/MacroPad.ino
          grep -F 'HapticpadInput::commitEdge' src/MacroPad.ino
          ! grep -F 'struct DebouncedInput {' src/MacroPad.ino
      - name: Run native firmware contracts
        run: bash ./tests/run_native_firmware_tests.sh
      - name: Install pinned PlatformIO Core
        run: |
          python3 -m pip install --disable-pip-version-check 'platformio==6.1.19'
          pio --version | grep '6.1.19'
      - name: Build CDC production firmware
        run: pio run -e pico
      - name: Build Raw HID v3 candidate firmware
        run: pio run -e pico-hid-v3
      - name: Commit debounce boundary integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MacroPad.ino
          if git diff --cached --quiet; then
            echo 'debounce boundary migration produced no changes' >&2
            exit 1
          fi
          git commit -m "refactor: isolate firmware debounce boundary"
          git pull --rebase origin main
          git push origin HEAD:main
