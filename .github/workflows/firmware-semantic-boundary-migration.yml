name: firmware-semantic-boundary-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firmware-semantic-boundary-migration.yml
      - .github/scripts/firmware_semantic_boundary_switch.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply semantic boundary migration
        run: python3 .github/scripts/firmware_semantic_boundary_switch.py
      - name: Verify semantic boundary ownership
        shell: bash
        run: |
          grep -F '#include "input_semantics.h"' src/MacroPad.ino
          grep -F 'HapticpadSemantics::decideMainStroke(g_thumbs)' src/MacroPad.ino
          grep -F 'HapticpadSemantics::consumePressedThumbs(g_thumbs)' src/MacroPad.ino
          grep -F 'HapticpadSemantics::makeThumbRuntime()' src/MacroPad.ino
          ! grep -F 'struct ThumbRuntime {' src/MacroPad.ino
          ! grep -F 'uint8_t activeModeThumbMask()' src/MacroPad.ino
          ! grep -F 'int8_t selectModeThumb(' src/MacroPad.ino
          ! grep -F 'uint8_t modifierForModeThumb(' src/MacroPad.ino
      - name: Run native firmware contracts
        run: bash ./tests/run_native_firmware_tests.sh
      - name: Install pinned PlatformIO Core
        run: |
          python3 -m pip install --disable-pip-version-check 'platformio==6.1.19'
          pio --version | grep '6.1.19'
      - name: Build CDC production firmware
        run: pio run -e pico
      - name: Build Raw HID v3 candidate firmware
        run: pio run -e pico-hid-v3
      - name: Commit semantic boundary integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MacroPad.ino
          if git diff --cached --quiet; then
            echo 'semantic boundary migration produced no changes' >&2
            exit 1
          fi
          git commit -m "refactor: isolate firmware semantic decision boundary"
          git pull --rebase origin main
          git push origin HEAD:main
