name: devloop-bootstrap-format

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/devloop-bootstrap-format.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Apply policy-safe autofix only
        working-directory: go-app
        run: gofmt -w ./tools/devloop/main.go ./tools/devloop/main_test.go
      - name: Verify devloop tests and manifests
        working-directory: go-app
        run: |
          go test -race ./tools/devloop
          go run ./tools/devloop -cmd validate
          go run ./tools/devloop -cmd next
          go run ./tools/devloop -cmd edge-report
      - name: Commit verified safe repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/tools/devloop/main.go go-app/tools/devloop/main_test.go
          if git diff --cached --quiet; then
            echo "no formatting changes produced" >&2
            exit 1
          fi
          git commit -m "style: gofmt engineering loop controller"
          git pull --rebase origin main
          git push origin HEAD:main
