name: handler-lookup-boundary-migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/handler-lookup-boundary-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Introduce action lookup port
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path('go-app/handler/actions.go')
          s = path.read_text(encoding='utf-8')
          s = s.replace('\t"hapticpad-go-app/config"\n', '', 1)

          marker = '''type ActionRequest struct {
          \tAction     domainaction.Action
          \tEnqueuedAt time.Time
          }
          '''.replace('          ', '')
          if marker not in s:
              raise SystemExit('ActionRequest marker not found')
          insertion = marker + '''
          // ActionLookup is the minimal port required by the execution layer. Concrete
          // keymap/layout repositories satisfy it without becoming handler dependencies.
          type ActionLookup interface {
          \tGetActionByMask(layer int, mask uint32) *domainaction.Action
          }
          '''.replace('          ', '')
          s = s.replace(marker, insertion, 1)

          s = s.replace('keymap *config.KeymapConfig', 'keymap ActionLookup')
          s = s.replace('func NewHandler(keymap *config.KeymapConfig) *Handler {', 'func NewHandler(keymap ActionLookup) *Handler {')
          s = s.replace('\tkeymap *config.KeymapConfig,\n', '\tkeymap ActionLookup,\n')
          path.write_text(s, encoding='utf-8')
          '@ | python -
          gofmt -w go-app/handler/actions.go
      - name: Verify handler repository independence
        shell: pwsh
        run: |
          if (Select-String -Path go-app/handler/actions.go -SimpleMatch 'hapticpad-go-app/config') { throw 'handler still imports config' }
          if (-not (Select-String -Path go-app/handler/actions.go -SimpleMatch 'type ActionLookup interface')) { throw 'ActionLookup port missing' }
          if (-not (Select-String -Path go-app/handler/actions.go -SimpleMatch 'GetActionByMask(layer int, mask uint32) *domainaction.Action')) { throw 'ActionLookup contract drifted' }
      - name: Race-test handler boundary
        working-directory: go-app
        run: go test -race ./action ./config ./handler ./textinput ./layoutedit ./architecture
      - name: Test full Windows application
        working-directory: go-app
        run: go test ./...
      - name: Vet application
        working-directory: go-app
        run: go vet ./...
      - name: Build Windows GUI
        working-directory: go-app
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit handler port migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/handler/actions.go
          if (git diff --cached --quiet) { throw 'handler lookup migration produced no changes' }
          git commit -m "refactor: decouple handler from config repository"
          git push origin HEAD:main
