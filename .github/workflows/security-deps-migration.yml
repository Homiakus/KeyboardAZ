name: security-deps-migration

# One-shot dependency security migration. Remove after the validated graph lands.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-deps-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-app/go.mod
          cache-dependency-path: go-app/go.sum
      - name: Upgrade vulnerable transitive modules
        working-directory: go-app
        shell: pwsh
        run: |
          go get golang.org/x/text@v0.39.0 golang.org/x/image@v0.43.0 golang.org/x/net@v0.55.0
          go mod tidy
          go list -m golang.org/x/text golang.org/x/image golang.org/x/net
      - name: Test Windows application
        working-directory: go-app
        shell: pwsh
        run: go test ./...
      - name: Race test runtime-critical packages
        working-directory: go-app
        shell: pwsh
        run: go test -race ./protocol ./appcore ./telemetry ./handler ./device ./connection ./transport ./latencyreport ./layoutedit ./workspace ./architecture
      - name: Vet application
        working-directory: go-app
        shell: pwsh
        run: go vet ./...
      - name: Verify reachable vulnerabilities are closed
        working-directory: go-app
        shell: pwsh
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...
      - name: Build Windows application
        working-directory: go-app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../dist | Out-Null
          go build -trimpath -ldflags "-s -w -H=windowsgui" -o ../dist/KeyboardAZ.exe .
      - name: Commit validated dependency fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go-app/go.mod go-app/go.sum
          if (git diff --cached --quiet) { throw 'security dependency migration produced no changes' }
          git commit -m "build: update vulnerable Go dependencies"
          git pull --rebase origin main
          git push origin HEAD:main
