; Standalone RP2040 USB HID keyboard project for the Azeron-style pad.
; Uses Arduino-Pico (Earle Philhower) because it has built-in USB HID Keyboard support.

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.mcu = rp2040
board_build.f_cpu = 133000000L
board_build.arduino.earlephilhower.usb_manufacturer = Azeron
board_build.arduino.earlephilhower.usb_product = Azeron USB HID Keyboard
upload_protocol = picotool
build_flags = -DNDEBUG
